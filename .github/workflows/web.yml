name: Web (iPhone + tests)

# Manuel, comme l'APK : le site ne change que quand on le décide.
# Actions -> Web (iPhone + tests) -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploie:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Les classements ont besoin de savoir où poser leurs scores. La clé
      # « anon » de Supabase est publique par construction (c'est le RLS du
      # schéma qui protège les données), mais elle reste hors du dépôt : elle
      # arrive en secret GitHub, déposée une fois dans Settings → Secrets and
      # variables → Actions. Sans elle, le site se déploie quand même — les
      # classements se disent simplement hors ligne.
      - name: Assemble www/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: pages
        uses: actions/deploy-pages@v4
