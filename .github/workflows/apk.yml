name: APK Android

# Volontairement manuel : on ne construit un APK que quand on veut vraiment
# une nouvelle version installable. Pour les essais du quotidien, la version
# web se déploie toute seule à chaque push (voir web.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de la version (ex. 0.2)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install

      # Comme pour le web : sans ces secrets, l'APK se construit et se joue,
      # mais ses classements restent hors ligne.
      - name: Assemble www/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # Le dossier android/ n'est pas versionné : Capacitor le régénère à
      # chaque build, ce qui évite de trimballer 200 fichiers Gradle dans git.
      - name: Génère le projet Android
        run: npx cap add android

      # Le keystore de release ne vit ni dans le dépôt ni dans cette
      # conversation : il arrive en secret GitHub (base64), déposé une fois
      # pour toutes dans Settings → Secrets and variables → Actions. Sans le
      # secret KEYSTORE_BASE64 (repo pas encore configuré), on retombe sur un
      # APK de debug non signé plutôt que de faire échouer le job.
      - name: Configure la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas de secret KEYSTORE_BASE64 : APK de debug, non signé."
            echo "SIGNE=non" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          # `android` est l'extension créée par le plugin Capacitor : on peut
          # la compléter en fin de fichier sans toucher au reste du build.gradle
          # généré, qui change d'une version de Capacitor à l'autre.
          cat >> android/app/build.gradle <<'EOF'

          android.signingConfigs {
              release {
                  storeFile file('release.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "SIGNE=oui" >> "$GITHUB_ENV"

      - name: Compile l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ "$SIGNE" = "oui" ]; then
            ./android/gradlew -p android assembleRelease
          else
            ./android/gradlew -p android assembleDebug
          fi

      - name: Renomme
        run: |
          if [ "$SIGNE" = "oui" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk arkad-${{ inputs.version }}.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk arkad-${{ inputs.version }}.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arkad-apk
          path: arkad-${{ inputs.version }}.apk

      # La release donne un lien direct téléchargeable depuis le téléphone,
      # là où un artefact d'Actions arrive sous forme de zip.
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}-${{ github.run_number }}"
          if [ "$SIGNE" = "oui" ]; then
            NOTES="APK signé, à installer directement sur le téléphone (autoriser les sources inconnues)."
          else
            NOTES="APK de debug, non signé (secret KEYSTORE_BASE64 absent) — à installer directement sur le téléphone (autoriser les sources inconnues)."
          fi
          gh release create "$TAG" "arkad-${{ inputs.version }}.apk" \
            --target "${{ github.sha }}" \
            --title "ARKAD ${{ inputs.version }}" \
            --notes "$NOTES"
